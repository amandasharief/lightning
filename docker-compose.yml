services:
  app:
    build: .
    volumes:
      - .:/var/lightning
    tty: true
    depends_on:
      - mysql
      - pgsql
    links:
      - mysql
      - pgsql
  mysql:
    image: mysql:8.0
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
  pgsql:
    image: postgres:12.5
    volumes:
      - pgsql:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
  redis:
    image: redis
    ports:
      - "6379:6379"
volumes:
  mysql-data:
  pgsql-data:
